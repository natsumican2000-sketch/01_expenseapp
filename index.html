        function changeMonth(change){currentCalendarDate.setMonth(currentCalendarDate.getMonth()+change); buildCalendar(); buildSummary();}

        function buildCalendar(){
            const displayYear = currentCalendarDate.getFullYear();
            const displayMonth = currentCalendarDate.getMonth();
            const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
            document.getElementById("calendarMonthTitle").textContent = `${monthNames[displayMonth]} ${displayYear}`;
            const expenses = JSON.parse(localStorage.getItem("expenseData"))||[];
            const monthlyExpenses=expenses.filter(record=>{
                const normalizedDate=record[0].replaceAll("/", "-");
                const recordYear=Number(normalizedDate.substring(0,4));
                const recordMonth=Number(normalizedDate.substring(5,7))-1;
                return(recordYear === displayYear && recordMonth === displayMonth);
            });
            const list = document.getElementById("monthlyExpenseList");
            list.innerHTML = "";
            let dailyTotals = {};
            monthlyExpenses.forEach(record =>{
                const normalizedDate = record[0].replaceAll("/", "-");
                const day = Number(normalizedDate.substring(8,10));
                const jpy = Number(record[3].replace(/,/g, ""));
                if(!dailyTotals[day]){dailyTotals[day]=0;}
                dailyTotals[day] += jpy;});
             console.log(dailyTotals);
            const table = document.getElementById("calendarTable");
            table.innerHTML = "";
            table.innerHTML += `
                <tr>
                    <th>Mon</th>
                    <th>Tue</th>
                    <th>Wed</th>
                    <th>Thu</th>
                    <th>Fri</th>
                    <th>Sat</th>
                    <th>Sun</th>
                </tr>
                `;
                const monthTotal = Object.values(dailyTotals).reduce((a,b)=>a+b,0);
                console.log("calendarTotal", monthTotal);
                document.getElementById("calendarTotal").textContent = `${monthNames[displayMonth]} ${displayYear} Total ¥ ${monthTotal.toLocaleString()}`;
                /* list.innerHTML ="";
                monthlyExpenses.forEach(record =>{
                    const originalIndex = expenses.indexOf(record);
                    list.innerHTML += `
                        <div onclick="goToHistory(${originalIndex})"
                        style="border-bottom:1px solid #dddddd; padding:10px 0; display:flex; justify-content:space-between; align-items:center; gap:10px; cursor:pointer;">
                        <div>${record[0]}</div>
                        <div>${record[5]}</div>
                        <div>${record[6]}</div>
                        <div style="color:green; font-weight:bold;">
                            ¥${record[3]}</div></div>`;
                });  */
                console.log(monthTotal);
                //document.getElementById("calendarTotal").tectContent = "TEST";
                const firstDay = new Date(displayYear, displayMonth,1).getDay();
                const startPosition = (firstDay + 6) % 7;
                const daysInMonth = new Date(displayYear, displayMonth + 1, 0).getDate();
                let day = 1;
                let cellPosition = 0;
                while(day <= daysInMonth){
                    let html = "<tr>";
                    for(let column=0; column<7; column++){
                        if(cellPosition<startPosition){html+="<td></td>";}
                        else if(day <= daysInMonth){
                            const total=dailyTotals[day]||0;
                            let amountText="";
                            if(total>0){amountText=`¥${total.toLocaleString()}`;}
                            let bgColor="";
                            if(total>0){bgColor="#e8f5e9";}
                            html +=`<td style="background-color:${bgColor};">
                                        <div>${day}</div>
                                        <div style="color:green; font-size:18px; margin-top:5px;">${amountText}</div>
                                        </td>`;
                                        day++;}
                            else{html += "<td></td>";} cellPosition++;}
                            html +="</tr>";
                            table.innerHTML += html;
                }
                buildCalendarExpenseList();    
        }

        function getCategoryColor(category){
            const categories = ["Rent or Hotel", "Food", "Houseware", "Transport", "Utility", "Communication", "Clothes", "Cosmetic", "Hobbies", "Entertainment", "Insurance"];
            const colors = ["#D7CCC8", "#C8B6A6", "#A1887F", "#CB997E", "#D4A373", "#F6D6A8", "#E9EDC9", "#CCD5AE", "#BFD7EA", "#CDB4DB", "#E6BECC"];
            const categoryIndex = categories.indexOf(category);
            if(categoryIndex >= 0){return colors[categoryIndex];}return "#D7CCC8";
        }

        function buildCalendarExpenseList(){

    const expenses =
        JSON.parse(
            localStorage.getItem("expenseData")
        ) || [];

    const displayYear =
        currentCalendarDate.getFullYear();

    const displayMonth =
        currentCalendarDate.getMonth();

    const list =
        document.getElementById(
            "monthlyExpenseList"
        );

    list.innerHTML = "";

    expenses.forEach((record, index) => {

        const normalizedDate =
            record[0].replaceAll("/", "-");

        const recordYear =

        function buildHistory(){

    const expenses =
        JSON.parse(
            localStorage.getItem("expenseData")
        ) || [];

    const historyList =
        document.getElementById("historyList");

    historyList.innerHTML = "";

    let currentMonth = "";

    expenses.forEach((record, index) => {

        const normalizedDate =
            record[0].replaceAll("/", "-");

        const month =
            normalizedDate.substring(0, 7);

        const category =
            record[5];

        const remarks =
            record[6] || "No remarks";

        const categoryColor =
            getCategoryColor(category);

        if(month !== currentMonth){

            currentMonth = month;

            historyList.innerHTML += `
                <div class="historyMonthTitle">
                    ${month}
                </div>
            `;
        }

        historyList.innerHTML += `
            <div
                id="history-${index}"
                class="historyCard"
            >

                <div class="historyTitleRow">

                    <span
                        class="historyColorBox"
                        style="
                            background-color:${categoryColor};
                        "
                    ></span>

                    <div class="historyRemarks">
                        ${remarks}
                    </div>

                </div>


                <div class="historyMetaRow">

                    <div>
                        ${record[0]}
                    </div>

                    <div class="historyCategory">
                        ${category}
                    </div>

                </div>


                <div class="historyDetails">

                    <div>
                        <div class="historyDetailLabel">
                            Amount
                        </div>

                        <div class="historyDetailValue">
                            ${record[1]}
                        </div>
                    </div>


                    <div>
                        <div class="historyDetailLabel">
                            Currency
                        </div>

                        <div class="historyDetailValue">
                            ${record[2]}
                        </div>
                    </div>


                    <div>
                        <div class="historyDetailLabel">
                            Rate
                        </div>

                        <div class="historyDetailValue">
                            ${record[4]}
                        </div>
                    </div>

                </div>


                <div class="historyFooter">

                    <div class="historyActions">

                        <button
                            class="historyButton"
                            onclick="editExpense(${index})"
                        >
                            Edit
                        </button>

                        <button
                            class="historyButton"

                    </div>

                    <div class="historyJPY">

}

        function goToHistory(index){
            showHistory();
            const target = document.getElementById(`history-${index}`);
            if(target){target.scrollIntoView({behavior:"smooth", block:"center"});
            target.style.backgroundColor = "#f0f0f0";
            setTimeout(() => {target.style.backgroundColor = "";},1000);}
        }

        function editExpense(index){
            const data = JSON.parse(localStorage.getItem("expenseData"))||[];
            const record = data[index];
            document.getElementById("expenseDate").value = record[0];
            document.getElementById("amount").value = record[1].replace(/,/g,"");
            document.getElementById("currency").value = record[2];
            document.getElementById("category").value = record[5];
            document.getElementById("memo").value = record[6];
            editIndex = index;
            document.getElementById("editingMessage").style.display = "block";
            document.getElementById("saveButton").textContent = "Update";
            document.getElementById("cancelEditButton").style.display = "block";
            showInput();
        }

        function cancelEdit(){

    // 編集モードを終了
    editIndex = -1;

    // 日付を今日に戻す
    document.getElementById("expenseDate").value =
        new Date().toISOString().split("T")[0];

    // 入力内容をリセット
    document.getElementById("amount").value = "";
    document.getElementById("currency").value = "JPY";
    document.getElementById("category").selectedIndex = 0;
    document.getElementById("memo").value = "";

    // 編集中メッセージを隠す
    document.getElementById("editingMessage").style.display =
        "none";

    // UpdateをSaveに戻す
    document.getElementById("saveButton").textContent =
        "Save";

    // Cancelボタンを隠す
    document.getElementById("cancelEditButton").style.display =
        "none";
}


    function deleteExpense(index){

    const confirmed =
        confirm("Are you sure you want to delete this expense?");

    if(!confirmed){
        return;
    }

    const expenses =
        JSON.parse(
            localStorage.getItem("expenseData")
        ) || [];

    expenses.splice(index, 1);

    localStorage.setItem(
        "expenseData",
        JSON.stringify(expenses)
    );

    editIndex = -1;

    buildCalendar();
    buildSummary();
    buildHistory();
}

function exportCSV(){
    const expenses = JSON.parse(localStorage.getItem("expenseData"))||[];
    if(expenses.length === 0){
        alert("No expense data founnd.");
        return;
    }
    let csv = "Date, Amount, Currency, JPY Amount, Rate, Category, Remarks\n";
    expenses.forEach(record => {
        csv +=
            `"${record[0]}",`+
            `"${record[1]}",`+
            `"${record[2]}",`+
            `"${record[3]}",`+
            `"${record[4]}",`+
            `"${record[5]}",`+
            `"${record[6]}"\n`;
    });

    const blob = new Blob(["\uFEFF"+csv],
        {type:"text/csv;charset=utf-8;"}
    );

    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    const today = new Date().toISOString().split("T")[0];
    link.href = url;
    link.download = `expense_${today}.csv`;
    link.click();
    URL.recokeObjectURL(url);
}

function exportExcel(){
    const expenses = JSON.parse(localStorage.getItem("expenseData"))||[];
    if(expenses.length === 0){
        alert("No expense data found."); return;
    }
    const excelData = [
        ["Date", "Amount", "Currency", "JPY Amount", "Rate", "Category", "Remarks"]
    ];
    expenses.forEach(record => {excelData.push(record);});
    const worksheet = XLSX.utils.aoa_to_sheet(excelData);
    const workbook = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(workbook, worksheet, "Expenses");
    const today = new Date().toISOString().split("T")[0];
    XLSX.writeFile(workbook, `expense_${today}.xlsx`);
}

        function buildSummary(){
            const displayYear=currentCalendarDate.getFullYear();
            const displayMonth=currentCalendarDate.getMonth();
            const monthNames=["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
            document.getElementById("summaryMonthTitle").textContent=`${monthNames[displayMonth]} ${displayYear} Summary`;
            const expenses = JSON.parse(localStorage.getItem("expenseData"))||[];
            const monthlyExpenses = expenses.filter(record => {
                const normalizedDate = record[0].replaceAll("/", "-");
                const recordYear = Number(normalizedDate.substring(0,4));
                const recordMonth = Number(normalizedDate.substring(5,7))-1;
                return(recordYear === displayYear && recordMonth === displayMonth);
            });
            const categories = ["Rent or Hotel", "Food", "Houseware", "Transport", "Utility", "Communication", "Clothes", "Cosmetic", "Hobbies", "Entertainment", "Insurance"];
            const summary = {};
            categories.forEach(category => {summary[category]=0;});
            monthlyExpenses.forEach(record => {const category = record[5]; const amount = Number(record[3].replace(/,/g,""));
            if(summary[category] === undefined){summary[category]=0;}
            summary[category] += amount;});
            const totalAmount = Object.values(summary).reduce((a,b) => a+b, 0);
            document.getElementById("summaryTotal").textContent = `Monthly Total ¥${totalAmount.toLocaleString()}`;
            // 0円ではないカテゴリだけグラフに使用

            responsive: true,

else{
